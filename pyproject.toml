[project]
name = "flow-crm"
version = "1.0.0"
description = "Flow: broker CRM with the MetaTrader 5 Manager API integrated (clients, accounts, payments, copy trading, IB, MT5 setup and automation)"
requires-python = ">=3.11"
# Compatible ranges; requirements.lock pins the exact versions that were tested.
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
    "uvicorn[standard]>=0.29,<1",
    "sqlalchemy>=2.0,<2.2",
    "pydantic[email]>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pyjwt>=2.8,<3",
    "bcrypt>=4.1,<6",
    "pyotp>=2.9,<3",
    "cryptography>=42",
    "python-multipart>=0.0.18,<1",
    "jinja2>=3.1.5,<4",
    "itsdangerous>=2.1,<3",
    "alembic>=1.13,<2",
    "qrcode>=7.4",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
mt5 = ["MT5Manager>=5.0.4000; sys_platform == 'win32'"]
# pgserver: bundled PostgreSQL for the local demo and the test suite (not used in production)
dev = ["pytest>=8", "httpx>=0.27", "pgserver>=0.1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*"]
"app.mt5" = ["link_modules.json"]
