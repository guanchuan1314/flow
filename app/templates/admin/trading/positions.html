{% extends "admin/layout.html" %}
{% block page_title %}Open positions{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header">
    <form class="row g-2" method="get">
      {% include "admin/trading/_filters.html" %}
      <div class="col-md-auto"><button class="btn btn-sm btn-primary"><i class="bi bi-funnel"></i> Filter</button></div>
      <div class="col-12 col-md text-md-end small text-muted align-self-center"><i class="bi bi-broadcast"></i> Auto-refreshes every 3 s</div>
    </form>
  </div>
  <div id="positions-table" hx-get="{{ request.url.include_query_params(partial=1) }}" hx-trigger="every 3s" hx-swap="innerHTML">
    {% include "admin/trading/positions_table.html" %}
  </div>
</div>
{% endblock %}
